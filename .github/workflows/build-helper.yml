# Builds ClassView Helper on real Windows and Mac machines (free GitHub runners).
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0.
# The finished files appear under the run's "Artifacts", and on tagged runs as a Release.
name: Build ClassView Helper
on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: helper } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: helper-windows, path: helper/dist/ClassView-Helper-Windows.exe }
  mac:
    runs-on: macos-latest
    defaults: { run: { working-directory: helper } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --mac dir --arm64 --x64 --publish never
      - name: Ad-hoc sign and zip
        run: |
          codesign --force --deep --sign - "dist/mac-arm64/ClassView Helper.app"
          codesign --force --deep --sign - "dist/mac/ClassView Helper.app"
          ditto -c -k --keepParent "dist/mac-arm64/ClassView Helper.app" dist/ClassView-Helper-Mac-AppleSilicon.zip
          ditto -c -k --keepParent "dist/mac/ClassView Helper.app" dist/ClassView-Helper-Mac-Intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: helper-mac
          path: |
            helper/dist/ClassView-Helper-Mac-AppleSilicon.zip
            helper/dist/ClassView-Helper-Mac-Intel.zip
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: out/* }
