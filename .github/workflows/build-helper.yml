# Builds ClassView Helper on real Windows and Mac machines (free GitHub runners).
# Runs whenever the Helper code changes on main, or from the Actions tab ("Run workflow").
# Publishes a GitHub Release named after the version in helper/package.json, so bump that
# version for each new release. The website's download buttons always point at the latest one.
name: Build ClassView Helper
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["helper/**", ".github/workflows/build-helper.yml"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: helper } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: helper-windows, path: helper/dist/ClassView-Helper-Windows.exe }
  mac:
    runs-on: macos-latest
    defaults: { run: { working-directory: helper } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --mac dir --arm64 --x64 --publish never
      - name: Ad-hoc sign and zip
        run: |
          codesign --force --deep --sign - "dist/mac-arm64/ClassView Helper.app"
          codesign --force --deep --sign - "dist/mac/ClassView Helper.app"
          ditto -c -k --keepParent "dist/mac-arm64/ClassView Helper.app" dist/ClassView-Helper-Mac-AppleSilicon.zip
          ditto -c -k --keepParent "dist/mac/ClassView Helper.app" dist/ClassView-Helper-Mac-Intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: helper-mac
          path: |
            helper/dist/ClassView-Helper-Mac-AppleSilicon.zip
            helper/dist/ClassView-Helper-Mac-Intel.zip
  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./helper/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: ClassView Helper ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            Download the file for your laptop:
            - Windows: ClassView-Helper-Windows.exe
            - Mac with Apple chip (M1–M4): ClassView-Helper-Mac-AppleSilicon.zip
            - Mac with Intel chip: ClassView-Helper-Mac-Intel.zip
          files: out/*
