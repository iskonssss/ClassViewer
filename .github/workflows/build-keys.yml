# Builds ClassView Keys (the trainer's keyboard/mouse overlay) on real Windows and Mac machines.
# Runs whenever keys/ changes on main, or from the Actions tab ("Run workflow").
# Publishes to a fixed release tagged "keys-latest" (never marked as the repo's latest release,
# so the Helper download links keep working). The website links to files on that release.
name: Build ClassView Keys
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["keys/**", ".github/workflows/build-keys.yml"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: keys } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: keys-windows, path: keys/dist/ClassView-Keys-Windows.exe }
  mac:
    runs-on: macos-latest
    defaults: { run: { working-directory: keys } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --mac dir --arm64 --x64 --publish never
      - name: Ad-hoc sign and zip
        run: |
          codesign --force --deep --sign - "dist/mac-arm64/ClassView Keys.app"
          codesign --force --deep --sign - "dist/mac/ClassView Keys.app"
          ditto -c -k --keepParent "dist/mac-arm64/ClassView Keys.app" dist/ClassView-Keys-Mac-AppleSilicon.zip
          ditto -c -k --keepParent "dist/mac/ClassView Keys.app" dist/ClassView-Keys-Mac-Intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: keys-mac
          path: |
            keys/dist/ClassView-Keys-Mac-AppleSilicon.zip
            keys/dist/ClassView-Keys-Mac-Intel.zip
  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./keys/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: keys-latest
          name: ClassView Keys (trainer overlay) ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          overwrite_files: true
          body: |
            ClassView Keys ${{ steps.v.outputs.version }} — for the trainer's laptop only.
            - Windows: ClassView-Keys-Windows.exe
            - Mac with Apple chip (M1–M4): ClassView-Keys-Mac-AppleSilicon.zip
            - Mac with Intel chip: ClassView-Keys-Mac-Intel.zip
          files: out/*
