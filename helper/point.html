<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Trainer pointer</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;pointer-events:none}
  .p{position:absolute;width:0;height:0}
  .ring{position:absolute;left:-34px;top:-34px;width:68px;height:68px;border-radius:50%;border:6px solid #ff3b7f;box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 24px rgba(255,59,127,.8);box-sizing:border-box;animation:pulse .9s ease-in-out infinite}
  .dot{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:#ff3b7f;box-shadow:0 0 0 3px #fff}
  .tag{position:absolute;left:42px;top:-46px;background:#ff3b7f;color:#fff;font:700 15px system-ui,-apple-system,"Segoe UI",sans-serif;padding:6px 10px;border-radius:8px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  @keyframes pulse{50%{transform:scale(1.35);opacity:.75}}
</style>
</head>
<body>
<script>
  const show = ({ x, y }) => {
    document.body.innerHTML = "";
    const p = document.createElement("div"); p.className = "p";
    p.style.left = (Math.min(1, Math.max(0, x)) * 100) + "vw";
    p.style.top = (Math.min(1, Math.max(0, y)) * 100) + "vh";
    p.innerHTML = '<div class="ring"></div><div class="dot"></div><div class="tag">Here!</div>';
    if (x > 0.8) p.querySelector(".tag").style.left = "-110px";
    if (y < 0.08) p.querySelector(".tag").style.top = "40px";
    document.body.appendChild(p);
  };
  window.helper.onPoint(show);
</script>
</body>
</html>
